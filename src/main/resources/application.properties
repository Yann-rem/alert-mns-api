# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5432/alertmns
spring.datasource.username=alertmns
spring.datasource.password=alertmns
spring.datasource.driver-class-name=org.postgresql.Driver

# Locale
spring.web.locale=en
spring.web.locale-resolver=fixed

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Activation par lien magique
alertmns.identity.activation.ttl=PT48H
alertmns.organisation.invitation.ttl=P7D
alertmns.identity.activation.frontend-base-url=http://localhost:4200/