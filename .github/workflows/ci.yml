name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Docker sanity check
        run: docker version

      - name: Build & test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Résoudre le nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alert-mns-api" >> "$GITHUB_ENV"

      - name: Se connecter au registre
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mise en production. La clé employée ici est restreinte côté serveur à l'exécution du
  # seul script de déploiement : elle n'ouvre pas de session interactive.
  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Préparer la clé de déploiement
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_ed25519 <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          # L'empreinte du serveur est fournie en variable plutôt que découverte à chaque
          # exécution : une découverte à la volée accepterait n'importe quel hôte se
          # présentant à cette adresse, ce qui viderait la vérification de son sens.
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Déployer
        run: ssh ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} deploy
